[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycontextdb"
version = "0.2.0"
description = "The unified context layer for AI agents — memory you can act on without treating wishes as facts"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [
    { name = "Gaurav Sharma", email = "gaurav@saaslabs.co" },
]
keywords = [
    "ai-agents",
    "memory",
    "context",
    "llm",
    "rag",
    "knowledge-graph",
    "vector-database",
    "agent-memory",
    "trust",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=1.24",
    "aiosqlite>=0.19",
    "openai>=1.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29", "pgvector>=0.2"]
faiss = ["faiss-cpu>=1.7"]
local = ["sentence-transformers>=2.0"]
neo4j = ["neo4j>=5.0"]
redis = ["redis>=5.0"]
rl = ["torch>=2.0", "trl>=0.7"]
all = [
    "asyncpg>=0.29",
    "pgvector>=0.2",
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.0",
    "neo4j>=5.0",
    "redis>=5.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "hypothesis>=6.0",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/atomsai/contextdb"
Documentation = "https://contextdb.dev"
Repository = "https://github.com/atomsai/contextdb"
Issues = "https://github.com/atomsai/contextdb/issues"

[project.scripts]
contextdb = "contextdb.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "SIM", "TCH"]
# ANN401: `Any` is legitimate for generic kwargs forwarding.
# TC00x: the stricter variants push runtime-needed imports into TYPE_CHECKING
# blocks, which breaks Pydantic models and `isinstance` checks. We import
# only what we need at runtime; keep the broader policy off.
# SIM102: nested ifs read better than AND-merged conditions when the clauses
# are independently meaningful.
ignore = ["ANN401", "TC001", "TC002", "TC003", "SIM102"]

[tool.mypy]
# Do not pin python_version to 3.10. NumPy 2.5+ stubs use PEP 695
# `type` aliases; mypy-as-3.10 cannot parse them, which reds the 3.12
# CI job (3.12 resolves NumPy 2.5; 3.10/3.11 stay on 2.4). Type-check
# as the running interpreter. The 3.10 CI job is what keeps our floor.
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["faiss", "sentence_transformers", "mcp", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["contextdb"]

# Defense in depth against accidentally shipping secrets or scratch files
# in the sdist (the 0.1.0 release got burned by a stray .rtf containing a
# token). Whatever lands here is excluded from both the sdist and the
# wheel build contexts.
[tool.hatch.build]
exclude = [
    "*.rtf",
    "*.key",
    "*.pem",
    "*.p12",
    ".env",
    ".env.*",
    "secrets/",
    "dist/",
    ".venv/",
    "prompts for users/",
    "*.pdf",
    "contextdb-*.md",
    "agentic-memory-*.md",
    "contextdb_cloud/",
    "cloud/",
    ".cursor/",
    "legal/signed/",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "*.rtf",
    "*.key",
    "*.pem",
    "*.p12",
    ".env",
    ".env.*",
    "secrets/",
    "dist/",
    ".venv/",
    "prompts for users/",
    "*.pdf",
    "contextdb-*.md",
    "agentic-memory-*.md",
    "contextdb_cloud/",
    "cloud/",
    ".cursor/",
    "legal/signed/",
]
