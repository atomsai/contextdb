name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Gitleaks + pre-commit checks. Scans the staged diff (and on CI the
  # full history via --no-git-log=false by default) for tokens. Runs in
  # parallel with `test` so secret leaks fail the PR even if contributors
  # skipped `pre-commit install` locally.
  secret-scan:
    name: Secret scan (gitleaks + pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs the full history to scan across commits,
          # not just the shallow checkout.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Open-core boundary
        run: python scripts/check_open_core_boundary.py
        env:
          CONTEXTDB_REQUIRE_PR_CLASSIFICATION: ${{ github.event_name == 'pull_request' }}
          CONTEXTDB_PR_BODY: ${{ github.event.pull_request.body }}

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with mypy
        run: mypy contextdb --python-version ${{ matrix.python-version }}

      - name: Run tests
        run: pytest

  postgres:
    name: Postgres integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONTEXTDB_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with Postgres support
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Run real Postgres tests
        run: |
          pytest \
            tests/unit/test_postgres_concurrency.py \
            tests/unit/test_scoped_id_access.py \
            tests/unit/test_vector_scope.py
